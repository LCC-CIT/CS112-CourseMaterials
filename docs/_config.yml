title: "CS 112 - Introduction to Artificial Intelligence"
description: "Course materials, lecture notes, and assignments for CS 112: Introduction to Artificial Intelligence."
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-sitemap
# jekyll-sitemap writes /sitemap.xml on every build. Keep non-page content out of it.
# For an unfinished page, add "sitemap: false" to its front matter.
defaults:
  - scope:
      path: "Assignments"
    values:
      sitemap: false
  - scope:
      path: "Exercises"
    values:
      sitemap: false
  - scope:
      path: "Images"
    values:
      sitemap: false
  - scope:
      path: "LectureNotes/Images"
    values:
      sitemap: false
  - scope:
      path: "Interactive"
    values:
      sitemap: false
