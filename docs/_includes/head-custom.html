<style>
.toc-nav {
  background-color: #f6f8fa;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  padding: 1rem 1.5rem;
  margin: 1.5rem 0;
  display: inline-block;
  min-width: 280px;
  max-width: 100%;
}
.toc-nav ul {
  list-style-type: disc;
  margin: 0;
  padding-left: 1.25rem;
}
.toc-nav li {
  margin: 0.35rem 0;
}
.toc-nav li.toc-h3 {
  margin-left: 1.25rem;
  list-style-type: circle;
}
.toc-nav li.toc-h4 {
  margin-left: 2.5rem;
  list-style-type: square;
}
.toc-nav a {
  text-decoration: none;
  color: #0969da;
}
.toc-nav a:hover {
  text-decoration: underline;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const candidates = document.querySelectorAll("p, div");
  let tocTarget = null;
  for (const el of candidates) {
    if (el.textContent.trim() === "[TOC]") {
      tocTarget = el;
      break;
    }
  }

  if (!tocTarget) return;

  const contentArea = document.querySelector(".markdown-body") || document.body;
  const headings = contentArea.querySelectorAll("h2, h3, h4");

  if (headings.length === 0) {
    tocTarget.remove();
    return;
  }

  const nav = document.createElement("nav");
  nav.className = "toc-nav";
  nav.setAttribute("aria-label", "Table of Contents");

  const ul = document.createElement("ul");

  headings.forEach(function (h) {
    const text = h.textContent.trim();
    if (text.toLowerCase() === "contents" || text.toLowerCase() === "table of contents") {
      return;
    }

    if (!h.id) {
      h.id = text.toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "");
    }

    const li = document.createElement("li");
    li.className = "toc-" + h.tagName.toLowerCase();

    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = text;

    li.appendChild(a);
    ul.appendChild(li);
  });

  nav.appendChild(ul);
  tocTarget.replaceWith(nav);
});
</script>
