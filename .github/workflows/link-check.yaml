name: Check links

on:
  repository_dispatch:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Build only /docs, the same way GitHub Pages does (github-pages gem and
      # theme), so the checker sees the published site and not the repo root.
      - name: Build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --cache --max-cache-age 1d ./_site/
          fail: true
